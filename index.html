<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>드로우 포트리스 v4</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
:root{--bg:#1d2a33;--panel:#263845;--line:#0f171d;--ink:#fff8ec;--muted:#c9d6de;--gold:#ffcf3a;--pop:#ff6a3d;--cream:#fff8ec;
  --display:"Jua","Noto Sans KR",system-ui,sans-serif;--body:"Noto Sans KR",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;width:100%;overflow:hidden;position:fixed;inset:0;margin:0;background:#0b1116;color:var(--ink);font-family:var(--body);font-size:12px}
#stage{position:absolute;left:50%;top:50%;width:844px;height:390px;transform:translate(-50%,-50%);transform-origin:center;background:var(--bg);overflow:hidden;padding:6px 8px;display:flex;flex-direction:column;gap:5px;-webkit-user-select:none;user-select:none}
#rot{position:fixed;left:0;right:0;top:12px;text-align:center;font-family:var(--display);font-size:15px;color:var(--muted);pointer-events:none}
button{font-family:var(--display);color:inherit;cursor:pointer}
.top{height:32px;display:flex;align-items:center;gap:10px;background:var(--panel);border:3px solid var(--line);border-radius:12px;padding:0 8px;flex:none}
.hearts{font-size:15px;color:#ff5c6c;letter-spacing:1px;font-family:var(--display)}
.wallstat{height:24px;display:flex;align-items:center;gap:5px;border:2px solid var(--line);border-radius:8px;background:#1a262e;color:var(--ink);font-family:var(--display);font-size:13px;padding:0 7px}
.wallstat .brick{width:14px;height:12px;border:1.5px solid var(--line);border-radius:2px;background:repeating-linear-gradient(0deg,#b9a58a 0 3px,#8a7556 3px 4px)}
.wallstat .wbar{width:90px;height:7px;border-radius:4px;background:#0f171d;overflow:hidden}
.wallstat .wbar i{display:block;height:100%;width:100%;background:#7fd0a0;transition:width .15s}
.wallstat.hurt .wbar i{background:#ffb04a}.wallstat.crit .wbar i{background:#ff5c6c}
.track{flex:1;display:flex;align-items:center;justify-content:center;gap:3px}
.wd{width:9px;height:9px;border-radius:50%;background:#3b5262;border:1.5px solid var(--line)}
.wd.judge{border-radius:2px;transform:rotate(45deg);background:#5a6fbd}.wd.boss{width:13px;height:13px;border-radius:4px;background:#7656bd}
.wd.done{background:#8fa7b5}.wd.now{box-shadow:0 0 0 3px rgba(255,207,58,.55);background:var(--gold)}
.stat{font-family:var(--display);font-size:15px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.coin{display:inline-block;width:13px;height:13px;border-radius:50%;background:var(--gold);border:2px solid var(--line)}
.items{display:flex;gap:3px}.it{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);background:#33495a;font-family:var(--display);font-size:11px;display:flex;align-items:center;justify-content:center}
.sbtn{height:24px;border:2px solid var(--line);border-radius:8px;background:var(--cream);color:#2a2233;font-size:12px;padding:0 8px}
.main{flex:1;display:flex;gap:6px;min-height:0}
.left{width:528px;display:flex;flex-direction:column;gap:5px}
.cvbox{position:relative;width:528px;height:248px}
canvas{width:528px;height:248px;display:block;border:3px solid var(--line);border-radius:14px;background:#2f6b57;touch-action:none}
.info{position:absolute;left:30px;top:6px;right:8px;display:flex;gap:6px;align-items:flex-start;pointer-events:none}
.info>*{pointer-events:auto}
.hcard{background:rgba(15,23,29,.9);border:2px solid #000;border-radius:10px;padding:4px 8px;font-size:10.5px;line-height:1.35;max-width:360px}
.hcard b{font-family:var(--display);font-weight:400;font-size:13px;color:var(--gold)}
.fuse{display:flex;flex-direction:column;gap:4px;margin-left:auto}
.dbtn{background:#33495a;color:#fff8ec}.dbtn.arm{background:#ff6b3d;color:#2a2233}
.tbtn{background:#9fe0a8}.tbtn:disabled{opacity:.5}
.fbtn{height:26px;border:2px solid var(--line);border-radius:9px;background:var(--gold);color:#2a2233;font-size:12px;padding:0 8px;box-shadow:0 2px 0 var(--line)}
.msg{position:absolute;left:30px;bottom:6px;right:8px;font-size:11px;background:rgba(15,23,29,.82);border-radius:8px;padding:3px 8px;pointer-events:none}
.msg:empty{display:none}
.banner{position:absolute;left:0;right:0;top:40%;text-align:center;font-family:var(--display);font-size:34px;color:var(--gold);text-shadow:0 3px 0 #000,0 0 18px rgba(255,207,58,.7);pointer-events:none;opacity:0;transition:opacity .2s}
.banner.on{opacity:1}
.fore{flex:1;display:flex;gap:5px;min-height:0}
.wcard{flex:1;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:3px 7px;font-size:10.5px;line-height:1.35;overflow:hidden}
.wcard.now{border-color:var(--gold)}
.wcard b{font-family:var(--display);font-weight:400;font-size:12px}
.buffs{flex:1.9;line-height:1.7;overflow:auto;padding-top:5px}
.bk{font-family:var(--display);color:var(--muted);margin-right:3px}
.chip{height:17px;border:1.5px solid var(--line);border-radius:6px;background:var(--gold);color:#2a2233;font-size:10px;padding:0 5px;font-family:var(--display);vertical-align:middle}
.right{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.boardwrap{position:relative;background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:6px;display:flex;flex-direction:row;gap:5px}
.board{display:grid;grid-template-columns:repeat(3,63px);gap:5px;flex:none}
.cell{height:76px;border-radius:9px;border:2.5px solid var(--line);background:#1a262e;position:relative;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;overflow:hidden}

/* ===== 공통 영웅 카드 (gcard) : s=뽑기 판, m=덱 짜기, l=카드 선택 ===== */
.gc{--el:#6b7f8c;position:relative;display:flex;flex-direction:column;width:100%;height:100%;border-radius:7px;background:linear-gradient(#fff8ec,#eedfc2);color:#2a2233;overflow:hidden;text-align:center;box-shadow:inset 0 0 0 2px var(--el)}
.gc-art{position:relative;flex:1;min-height:0;margin:2px 2px 0;border-radius:5px 5px 0 0;background-color:var(--el);background-image:radial-gradient(circle at 50% 35%,rgba(255,255,255,.35),rgba(0,0,0,.18));background-size:cover;background-position:center 22%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:20px;color:rgba(255,255,255,.92);text-shadow:0 2px 0 rgba(0,0,0,.35)}
.gc-art.img{background-image:var(--face)}
.gc-role,.gc-tier{position:absolute;top:2px;font-family:var(--display);font-style:normal;font-size:8px;line-height:11px;color:#fff;border-radius:5px;padding:0 3px;text-shadow:none}
.gc-role{left:2px;background:rgba(15,23,29,.78)}
.gc-tier{right:2px}
.gc-name{font-family:var(--display);font-size:10px;line-height:12px;white-space:nowrap;letter-spacing:-.5px;padding:1px 1px 0;border-top:2px solid var(--el);margin:0 2px}
.gc-desc{font-size:8.5px;line-height:10px;color:#4d4256;padding:0 2px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc-desc b{font-family:var(--display);font-weight:400;color:#1c6fb8}
.gc.s .gc-tier{font-size:0;width:8px;height:8px;padding:0;border-radius:50%;border:1.5px solid #fff8ec}
.gc.m .gc-name{font-size:11px;line-height:13px}
.gc.l{height:auto;border-radius:12px;box-shadow:inset 0 0 0 3px var(--el)}
.gc.l .gc-art{flex:none;height:78px;margin:4px 4px 0;border-radius:8px 8px 0 0;font-size:34px}
.gc.l .gc-role,.gc.l .gc-tier{font-size:10px;line-height:15px;padding:0 5px;top:4px}.gc.l .gc-role{left:4px}.gc.l .gc-tier{right:4px}
.gc.l .gc-name{font-size:16px;line-height:22px;margin:0 4px;letter-spacing:0}
.gc.l .gc-desc{font-size:10.5px;line-height:1.4;white-space:normal;text-align:left;padding:3px 8px 6px;overflow:visible}
.gc.jk{--el:#ffcf3a;background:linear-gradient(135deg,#e8553a,#ffcf3a,#38a356,#2a84dd,#7656bd);color:#fff}
.gc.jk .gc-art{background:rgba(15,23,29,.35)}.gc.jk .gc-desc{color:#fff}.gc.jk .gc-name{border-top-color:#fff8ec}
.cell .nm{font-family:var(--display);font-size:12px;color:#2a2233;line-height:1.05;text-align:center;padding:0 2px}
.cell .sub{font-size:9px;color:#3a3040}
.cell.card{background:var(--cream)}
.cell .stripe{position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:6px 0 0 6px}
.cell.tagged{overflow:visible;z-index:2}
.cell.held::after{content:"홀드";position:absolute;top:2px;right:2px;font-family:var(--display);font-size:9px;background:#2a84dd;color:#fff;border-radius:5px;padding:0 4px}
.cell.sel{box-shadow:0 0 0 3px #fff}
.cell.open{box-shadow:0 0 0 3px var(--gold),0 0 12px var(--gold)}
.ltag{position:absolute;left:50%;top:0;transform:translate(-50%,-55%);font-family:var(--display);font-size:11px;line-height:15px;white-space:nowrap;background:var(--pop);color:#fff8ec;border:2px solid var(--line);border-radius:999px;padding:0 8px;box-shadow:0 2px 0 var(--line);z-index:3;animation:tagpop .9s ease-in-out infinite}
.ltag.el{background:#2a84dd}
@keyframes tagpop{0%,100%{transform:translate(-50%,-55%) scale(1)}50%{transform:translate(-50%,-55%) scale(1.08)}}
@media (prefers-reduced-motion:reduce){.ltag{animation:none}}
.cell.open{cursor:pointer}
.pop .cbtn{height:auto;min-height:28px;padding:3px 8px;white-space:normal;line-height:1.3}
.cell.pick{box-shadow:0 0 0 4px #fff,0 0 14px #fff}
.cell.near{box-shadow:0 0 0 2px rgba(255,207,58,.75)}
.cell.sel,.cell.sel.near,.cell.sel.open,.cell.sel.held{box-shadow:0 0 0 3px #fff,0 0 10px rgba(255,255,255,.7);z-index:1}
.cell.swapsel,.cell.swapsel.near,.cell.swapsel.open{box-shadow:0 0 0 3px #7fd0ff}
/* ===== 완성된 줄 강조 ===== */
.board{position:relative}
.board.hasopen .cell:not(.open){opacity:.4;filter:saturate(.45)}
.board.hasopen .cell.sel:not(.open),.board.hasopen .cell.held:not(.open){opacity:.75;filter:none}
.cell.open.jp{box-shadow:0 0 0 4px #ffcf3a,0 0 16px 5px rgba(255,207,58,.95);transform:scale(1.05);z-index:2;animation:jpp .7s ease-in-out infinite alternate}
.cell.open.elo{box-shadow:0 0 0 3px #7fd0ff,0 0 12px 2px rgba(127,208,255,.9);z-index:1}
@keyframes jpp{from{box-shadow:0 0 0 4px #ffcf3a,0 0 10px 2px rgba(255,207,58,.8)}to{box-shadow:0 0 0 5px #fff3a8,0 0 24px 9px rgba(255,207,58,1)}}
.lbar{position:absolute;height:9px;border-radius:5px;background:linear-gradient(90deg,#fff8d0,#ffcf3a 50%,#fff8d0);box-shadow:0 0 12px 3px rgba(255,207,58,.95);transform-origin:0 50%;pointer-events:none;z-index:3;opacity:.92;animation:lbp .7s ease-in-out infinite alternate}
.lbar.el{height:5px;background:#bfe3ff;box-shadow:0 0 8px 2px rgba(127,208,255,.9);animation:none;opacity:.8}
@keyframes lbp{from{opacity:.65}to{opacity:1}}
.ltag.jp{font-size:13px;line-height:19px;background:#ffcf3a;color:#2a2233;padding:0 10px;z-index:5}
.ltag.jp::before{content:"★ 잭팟 · "}
@media (prefers-reduced-motion:reduce){.cell.open.jp,.lbar{animation:none}}

.cell.joker{background:linear-gradient(135deg,#e8553a,#ffcf3a,#38a356,#2a84dd,#7656bd)}
.cell.joker .nm{color:#fff;text-shadow:0 1px 0 #000}
.drawov{position:absolute;left:6px;width:199px;top:6px;height:238px;z-index:2;border-radius:12px;border:3px dashed rgba(255,207,58,.9);background:rgba(15,23,29,.55);color:var(--gold);font-family:var(--display);font-size:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-shadow:0 2px 0 #000;animation:pulse 1.4s ease-in-out infinite}
.drawov small{font-size:12px;color:var(--ink);font-family:var(--body)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,207,58,.0)}50%{box-shadow:0 0 0 6px rgba(255,207,58,.35)}}
@media (prefers-reduced-motion:reduce){.drawov{animation:none}}
.bstat{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.sc{flex:1;height:auto;flex-direction:column;border:2px solid var(--line);border-radius:9px;background:#1a262e;color:var(--muted);font-family:var(--display);font-size:11px;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 4px;white-space:nowrap}
.sc .pips{display:flex;gap:3px;align-items:center}
.pip{width:9px;height:9px;border-radius:50%;border:1.5px solid #5b6f7c;background:transparent}
.pip.on{background:#2a84dd;border-color:#bfe3ff}
.pip.el{border-radius:2px;transform:rotate(45deg);width:8px;height:8px}.pip.el.on{background:#bfe3ff;border-color:#fff}
.pip.miss.on{background:var(--pop);border-color:#ffb199}
.sc .star{font-size:12px;color:#5b6f7c;line-height:1}.sc.hot{border-color:var(--gold);color:var(--gold)}.sc.hot .star{color:var(--gold)}
.sc.lock{opacity:.6}
.claims{display:flex;flex-direction:column;gap:3px;min-height:0;flex:1;overflow:auto}
.cbtn{height:26px;border:2px solid var(--line);border-radius:9px;background:var(--gold);color:#2a2233;font-size:12px;text-align:left;padding:0 8px;box-shadow:0 2px 0 var(--line)}
.cbtn.el{background:#bfe3ff}
.tip{font-size:10.5px;color:var(--muted);line-height:1.35}
.acts{display:flex;gap:5px;flex:none}
.b{white-space:nowrap;height:38px;border:2px solid var(--line);border-radius:11px;background:var(--cream);color:#2a2233;font-size:14px;box-shadow:0 3px 0 var(--line);display:flex;align-items:center;justify-content:center;gap:4px;padding:0 6px;flex:1}
.b.main{background:var(--pop);color:var(--ink);font-size:15px;flex:1.4}.b.yel{background:var(--gold)}.b.blue{background:#7fd0ff}
.b:disabled{opacity:.4;cursor:default}
.b.locked{background:#3b5262;color:var(--muted)}
.pop{position:absolute;right:8px;bottom:52px;width:300px;z-index:15;background:var(--cream);color:#2a2233;border:3px solid var(--line);border-radius:14px;padding:9px 11px;font-size:12px;line-height:1.5;box-shadow:0 4px 0 var(--line)}
.pop b{font-family:var(--display);font-weight:400;font-size:14px}
.pop small{display:block;margin-top:4px;color:#8a7556}
.overlay{position:absolute;inset:0;background:rgba(10,15,20,.86);display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}
.ov{width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:9px}
.ov h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0;text-align:center}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;width:100%}
.pk.pkc{width:176px;padding:0;gap:5px;background:transparent;border:0;box-shadow:none}.pk.pkc .btns{justify-content:center}.pk.pkc b{font-size:inherit}
.pk{width:236px;border:3px solid var(--line);border-radius:16px;background:var(--cream);color:#2a2233;padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 0 var(--line);text-align:left}
.pk b{font-family:var(--display);font-weight:400;font-size:16px}
.pk .d{font-size:11.5px;color:#4d4256;line-height:1.4}
.pk .btns{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.mini{height:28px;border:2px solid var(--line);border-radius:8px;background:var(--gold);color:#2a2233;font-size:12px;padding:0 8px}
.mini.alt{background:#bfe3ff}.mini.grey{background:#e9dfcf}
.tut{position:absolute;inset:0;z-index:30}
.spot{position:absolute;border-radius:14px;box-shadow:0 0 0 9999px rgba(8,12,16,.72),0 0 0 3px var(--gold);transition:all .25s;pointer-events:none}
.tbub{position:absolute;width:292px;background:var(--cream);color:#2a2233;border:3px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;gap:8px;transition:all .25s}
.tbub .st{font-family:var(--display);font-size:11px;color:#8a7556}
.tbub .tx{font-size:13px;line-height:1.5}
.tbub .tx b{font-family:var(--display);font-weight:400;color:#c0392b}
.tbub .tb{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.tnext{height:34px;min-width:96px;border:2px solid var(--line);border-radius:10px;background:var(--pop);color:#fff8ec;font-size:15px;box-shadow:0 3px 0 var(--line)}
.tskip{height:28px;border:0;background:transparent;color:#8a7556;font-size:12px;text-decoration:underline}
.bld{width:100%;height:100%;display:flex;gap:8px;align-items:stretch}
.bgrid{width:380px;flex:none;display:grid;grid-template-columns:22px repeat(5,66px);grid-auto-rows:min-content;gap:4px;align-content:start}
.bh{font-family:var(--display);font-size:11px;text-align:center;align-self:center}
.bt{height:79px;border-radius:9px;border:2.5px solid var(--line);background:var(--cream);color:#2a2233;position:relative;padding:0;display:block;overflow:hidden}
.bt .stripe{position:absolute;left:0;top:0;bottom:0;width:6px}
.bt .nm{font-family:var(--display);font-size:12px;line-height:1.05;text-align:center}
.bt .ab{font-size:9px;color:#1c6fb8}
.bt .tr{position:absolute;top:2px;right:3px;font-family:var(--display);font-size:8.5px;color:#fff;border-radius:5px;padding:0 4px;line-height:13px}
.bt .cp{display:flex;gap:3px;justify-content:center;padding:1px 0 3px}.bt .cp i{width:9px;height:9px;border-radius:2px;border:1.5px solid #8a7556;background:transparent}.bt .cp i.on{background:#c0392b;border-color:#7a1f14}
.bt.in{box-shadow:0 0 0 3px var(--gold);background:#fff3c4}
.bt.foc{outline:3px solid #7fd0ff;outline-offset:1px}
.bside{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.bbox{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:5px 8px;font-size:11px;line-height:1.5}
.bbox b{font-family:var(--display);font-weight:400;font-size:13px}
.bslots{display:flex;flex-wrap:wrap;gap:3px}
.bs{height:18px;border-radius:6px;border:1.5px dashed #5b6f7c;font-family:var(--display);font-size:9.5px;display:flex;align-items:center;justify-content:center;color:#fff;white-space:nowrap;padding:0 5px}
.bs.on{border:1.5px solid var(--line)}
.warn{color:#ffb04a}.good{color:#7fd0a0}
.bcode{display:flex;gap:4px;align-items:center}
.bcode input{flex:1;min-width:0;height:24px;border-radius:7px;border:2px solid var(--line);background:#1a262e;color:var(--ink);font-family:var(--display);font-size:11px;text-align:center;letter-spacing:1px;text-transform:uppercase}
.alist{width:100%;max-width:800px;display:flex;flex-direction:column;gap:4px}
.arow{display:grid;grid-template-columns:1.25fr 1fr 1.35fr;gap:5px;align-items:center}
.arow .an{background:var(--panel);border:2px solid var(--line);border-left-width:6px;border-radius:8px;padding:3px 7px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .an b{font-family:var(--display);font-weight:400;font-size:13px}
.arow .mini{height:30px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .mini small{font-family:var(--body);font-size:9.5px;opacity:.7}
.hwrap{width:100%;height:362px;display:flex;flex-direction:column;gap:6px}
.htabs{display:flex;gap:5px;flex:none}
.htab{height:30px;flex:1;border:2px solid var(--line);border-radius:10px 10px 4px 4px;background:#33495a;color:var(--muted);font-size:14px}
.htab.on{background:var(--gold);color:#2a2233}
.htab.hx{flex:0 0 84px;background:var(--cream);color:#2a2233;border-radius:10px}
.hpane{flex:1;min-height:0;overflow:auto;background:var(--panel);border:3px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:7px;font-size:11.5px;line-height:1.5}
.hpane b{font-family:var(--display);font-weight:400;color:var(--ink)}
.hsteps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.hstep{background:#1a262e;border:2px solid var(--line);border-radius:10px;padding:6px 7px;display:flex;flex-direction:column;gap:3px;color:var(--muted)}
.hstep>b{font-size:14px;color:var(--gold)}
.hnote{color:var(--muted)}
.hel{display:flex;gap:12px;align-items:center}
.hcap{font-size:10.5px;color:var(--muted);text-align:center;margin-top:2px}

const cv=$('cv'),cx=cv.getContext('2d');cx.setTransform(2,0,0,2,0,0);
function toLocal(ev){const r=cv.getBoundingClientRect();return{x:(ev.clientX-r.left)/r.width*W,y:(ev.clientY-r.top)/r.height*H}}
let drag=null;
cv.addEventListener('pointerdown',ev=>{if(!G||G.phase!=='prep')return;const p=toLocal(ev);const u=G.field.find(v=>Math.hypot(v.hx-p.x,v.hy-p.y)<18);if(u){selHero=u.id;drag={u,ox:p.x,oy:p.y,moved:false};cv.setPointerCapture(ev.pointerId)}else selHero=null;renderInfo()});
cv.addEventListener('pointermove',ev=>{if(!drag)return;const p=toLocal(ev);if(Math.hypot(p.x-drag.ox,p.y-drag.oy)>4)drag.moved=true;if(drag.moved){drag.u.x=Math.max(36,Math.min(ZONE-14,p.x));drag.u.y=Math.max(22,Math.min(H-22,p.y))}});
cv.addEventListener('pointerup',ev=>{if(!drag)return;if(drag.moved){const i=G.field.indexOf(drag.u);const r=place(i,drag.u.x,drag.u.y);drag.u.x=drag.u.hx;drag.u.y=drag.u.hy;after(r)}drag=null});
function heroDot(u,x,y,sel){const r=14;cx.save();if(u.els.length>1){cx.beginPath();cx.arc(x,y,r,Math.PI/2,Math.PI*1.5);cx.fillStyle=COL[u.els[0]];cx.fill();cx.beginPath();cx.arc(x,y,r,-Math.PI/2,Math.PI/2);cx.fillStyle=COL[u.els[1]];cx.fill()}else{cx.beginPath();cx.arc(x,y,r,0,7);cx.fillStyle=COL[u.el];cx.fill()}
  cx.lineWidth=sel?3.5:2.5;cx.strokeStyle=sel?'#fff':'#0f171d';cx.beginPath();cx.arc(x,y,r,0,7);cx.stroke();
  const fi=FIMG[u.name];if(fi&&fi.complete&&fi.naturalWidth){cx.save();cx.beginPath();cx.arc(x,y,r-2,0,7);cx.clip();cx.drawImage(fi,x-r+2,y-r+2,(r-2)*2,(r-2)*2);cx.restore()}else{cx.fillStyle='#fff8ec';cx.beginPath();cx.arc(x,y,7,0,7);cx.fill();cx.fillStyle='#2a2233';cx.font='9px Jua, sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(RI[u.role],x,y+.5)}
  cx.fillStyle='#0f171d';cx.fillRect(x+6,y-r-6,20,11);cx.fillStyle=Object.values(u.imps).some(v=>v===3)?'#ff9de0':'#ffcf3a';cx.font='8.5px Jua, sans-serif';cx.fillText('Lv'+u.lv,x+16,y-r);cx.restore()}
function paint(){const g=cx;g.clearRect(0,0,W,H);const grd=g.createLinearGradient(0,0,W,0);grd.addColorStop(0,'#3a7d5f');grd.addColorStop(1,'#2a5f4c');g.fillStyle=grd;g.fillRect(0,0,W,H);
  for(let y=0;y<H;y+=14){g.fillStyle=(y/14)%2?'#b9a58a':'#a89276';g.fillRect(0,y,WALLX,13)}g.fillStyle='rgba(0,0,0,.25)';g.fillRect(WALLX,0,3,H);
  if(!G)return;
  {const lost=1-wallNow()/WALLMAX();if(lost>0){g.fillStyle='rgba(20,10,10,.62)';g.fillRect(0,0,WALLX,H*lost);g.strokeStyle='#ff5c6c';g.lineWidth=2;g.beginPath();g.moveTo(0,H*lost);g.lineTo(WALLX,H*lost);g.stroke()}}
  if(G.phase==='prep'){g.setLineDash([5,5]);g.strokeStyle='rgba(255,255,255,.25)';g.beginPath();g.moveTo(ZONE,0);g.lineTo(ZONE,H);g.stroke();g.setLineDash([]);
    const s=waveSummary(G.wave);Object.entries(s.by).forEach(([y,t])=>{y=+y;g.fillStyle='rgba(255,107,61,.85)';g.beginPath();g.moveTo(W-6,y);g.lineTo(W-28,y-10);g.lineTo(W-28,y+10);g.fill();
      g.fillStyle='#fff8ec';g.font='10px Jua, sans-serif';g.textAlign='right';g.textBaseline='middle';g.fillText(Object.entries(t).map(([tt,c])=>TYPEN[tt]+c).join(' '),W-32,y)});
    G.field.forEach(u=>{if(u.id===selHero){const rr=ROLE[u.role].range*(1+.25*(u.imps.reach===3?4:(u.imps.reach||0)));g.strokeStyle='rgba(255,255,255,.35)';g.setLineDash([4,4]);g.beginPath();g.arc(u.hx,u.hy,u.role==='tank'?140:u.role==='melee'?200:rr,0,7);g.stroke();g.setLineDash([])}})}
  (G.fx||[]).forEach(f=>{g.globalAlpha=Math.max(0,Math.min(1,f.t/.3));g.strokeStyle=COL[f.c]||'#fff';g.lineWidth=2;if(f.k==='ring'){g.beginPath();g.arc(f.x,f.y,f.r,0,7);g.stroke()}else{g.beginPath();g.moveTo(f.x1,f.y1);g.lineTo(f.x2,f.y2);g.stroke()}g.globalAlpha=1});
  if(G.phase==='battle')(G.enemies||[]).forEach(e=>{if(e.hp<=0)return;g.save();g.fillStyle=e.type==='boss'?'#4a2b63':'#2d2235';g.strokeStyle=COL[e.el];g.lineWidth=2.5;
    if(e.type==='rush'){g.beginPath();g.moveTo(e.x-e.r,e.y);g.lineTo(e.x+e.r,e.y-e.r);g.lineTo(e.x+e.r,e.y+e.r);g.closePath();g.fill();g.stroke()}
    else if(e.type==='brute'){g.fillRect(e.x-e.r,e.y-e.r,e.r*2,e.r*2);g.strokeRect(e.x-e.r,e.y-e.r,e.r*2,e.r*2)}
    else if(e.type==='ward'){g.beginPath();g.arc(e.x,e.y,e.r,0,7);g.fill();g.stroke();g.save();g.strokeStyle='#8fe3ff';g.lineWidth=2;g.setLineDash([4,3]);g.beginPath();g.arc(e.x,e.y,e.r+4,0,7);g.stroke();g.restore()}
    else{if(e.type==='flyer'){g.fillStyle='rgba(255,255,255,.5)';g.beginPath();g.ellipse(e.x+2,e.y-7,10,4,0,0,7);g.fill();g.fillStyle='#2d2235'}g.beginPath();g.arc(e.x,e.y,e.r,0,7);g.fill();g.stroke()}
    if(e.frozen>0){g.strokeStyle='#bfe3ff';g.lineWidth=3;g.beginPath();g.arc(e.x,e.y,e.r+3,0,7);g.stroke()}
    if(e.type==='boss'){g.fillStyle='#ffcf3a';g.font='14px Jua, sans-serif';g.textAlign='center';g.fillText('👑',e.x,e.y-e.r-8)}
    const w=e.type==='boss'?50:20;g.fillStyle='#000';g.fillRect(e.x-w/2,e.y-e.r-6,w,3);g.fillStyle='#ff5c6c';g.fillRect(e.x-w/2,e.y-e.r-6,w*Math.max(0,e.hp/e.max),3);g.restore()});
  G.field.forEach(u=>{heroDot(u,u.x,u.y,u.id===selHero);if(u.fxT>0){const k=1-u.fxT/1.2;g.save();g.globalAlpha=Math.max(0,1-k);g.strokeStyle='#ffcf3a';g.lineWidth=3;g.beginPath();g.arc(u.x,u.y,16+k*26,0,7);g.stroke();g.fillStyle='#ffcf3a';g.strokeStyle='#0f171d';g.lineWidth=3;g.font='15px Jua, sans-serif';g.textAlign='center';g.textBaseline='middle';g.strokeText(u.fxTxt||'',u.x,u.y-26-k*16);g.fillText(u.fxTxt||'',u.x,u.y-26-k*16);g.restore()}});
}

function elDiagram(){const P={fire:[70,26],leaf:[120,112],water:[20,112],light:[190,50],dark:[190,112]};const dot=e=>`<circle cx="${P[e][0]}" cy="${P[e][1]}" r="17" fill="${COL[e]}" stroke="#0f171d" stroke-width="3"/><text x="${P[e][0]}" y="${P[e][1]+4}" text-anchor="middle" font-family="Jua, sans-serif" font-size="12" fill="#fff8ec">${ELN[e]}</text>`;
  const arrow=(a,b,off)=>{off=off||0;const [x1,y1]=P[a],[x2,y2]=P[b],dx=x2-x1,dy=y2-y1,d=Math.hypot(dx,dy),ux=dx/d,uy=dy/d,ox=-uy*off,oy=ux*off;return `<line x1="${x1+ux*21+ox}" y1="${y1+uy*21+oy}" x2="${x2-ux*25+ox}" y2="${y2-uy*25+oy}" stroke="#fff8ec" stroke-width="3" marker-end="url(#ah)"/>`};

  $('ovc').innerHTML=`<div class="bld"><div class="bgrid">${g}</div><div class="bside">
   <div class="bbox"><b>내 덱 ${myDeck.length}/${DECK_SIZE}장</b> <span style="color:var(--muted)">${R.u.length}종 · 일반·고급 3장, 희귀 2장, 전설 1장까지</span><div class="bslots" style="margin-top:3px">${chips||'<span style="color:var(--muted)">영웅을 눌러 카드를 넣으세요</span>'}</div></div>
   <div class="bbox" style="flex:1;overflow:auto">${f?`<b style="color:${COL[f.el]}">${f.name}</b> <span style="color:${TCOL[f.tier]}">${TIERN[f.tier]}</span> · ${ELN[f.el]} ${ROLE[f.role].n}<br><span style="color:#7fd0ff">◆ ${ABIL[f.name][0]}</span>: ${ABIL[f.name][1]}<br><span style="color:var(--muted)">${FUSIONS.filter(x=>x[0]===f.name||x[1]===f.name).map(x=>`조합: ${x[0]===f.name?x[1]:x[0]}와 → ${x[2]}`).join(' / ')||'조합 레시피 없음'}</span><div class="row" style="justify-content:flex-start;gap:6px;margin-top:3px;align-items:center"><button type="button" class="mini grey" id="bMinus" ${countIn(myDeck,f.name)?'':'disabled'}>− 빼기</button><b>${countIn(myDeck,f.name)} / ${capOf(f.name)}장</b><button type="button" class="mini" id="bPlus" ${countIn(myDeck,f.name)<capOf(f.name)&&!full?'':'disabled'}>+ 넣기</button></div>`:'영웅을 누르면 능력이 보입니다. <b style="font-size:11px">한 번 더 누르면 1장씩 들어갑니다.</b> 많이 넣은 영웅일수록 뽑기 판에 자주 나옵니다.'}</div>
   <div class="bbox"><b>덱 분석</b> 역할 ${ROLES.map(r=>`${RI[r]}${R.rl[r]}`).join(' ')} · 속성 ${Object.entries(R.els).map(([e,c])=>`<span style="color:${COL[e]}">${ELN[e]}${c}</span>`).join(' ')||'-'}<br>조합 ${R.rec.map(x=>x[2]).join(', ')||'없음'}${st.length?` · 선발 ${st.join(', ')}`:''}${od?`<br>뽑기 한 번에 잭팟 ${od.h}% · 속성줄 ${od.e}%`:''}${R.notes.length?'<br>'+R.notes.join(' · '):''}</div>
   <div class="bcode"><input id="bCode" maxlength="15" value="${deckCode(myDeck)}" aria-label="덱 코드"><button type="button" class="mini grey" id="bLoad">불러오기</button><button type="button" class="mini grey" id="bClr">비우기</button></div>
   <div class="row" style="gap:6px"><button type="button" class="mini grey" id="bBack" style="height:34px">뒤로</button><button type="button" class="b main" id="bGo" style="height:34px" ${full?'':'disabled'}>${full?'이 덱으로 출전':`${DECK_SIZE-myDeck.length}장 더 넣으세요`}</button></div></div></div>`;
  const add=n=>{if(myDeck.length<DECK_SIZE&&countIn(myDeck,n)<capOf(n)){myDeck.push(n);saveDeck()}},sub=n=>{const i=myDeck.lastIndexOf(n);if(i>=0){myDeck.splice(i,1);saveDeck()}};
  $('ovc').querySelectorAll('.bt').forEach(b=>b.onclick=()=>{const n=b.dataset.n;if(bFocus===n)add(n);else bFocus=n;showBuilder()});
  if($('bPlus'))$('bPlus').onclick=()=>{add(bFocus);showBuilder()};if($('bMinus'))$('bMinus').onclick=()=>{sub(bFocus);showBuilder()};
  $('bLoad').onclick=()=>{const d=codeDeck($('bCode').value);if(d.length){myDeck=d;saveDeck()}showBuilder()};
  $('bClr').onclick=()=>{myDeck=[];bFocus=null;saveDeck();showBuilder()};$('bBack').onclick=showDecks;
  $('bGo').onclick=()=>{const ci=PRESETS.findIndex(p=>p.custom);PRESETS[ci].list=sortDeck(myDeck);newRun(ci,(Date.now()%1e9)|0);ov.hidden=true;selCell=-1;selHero=null;pred=null;$('msg').textContent=G.msg;render()}}
requestAnimationFrame(loop);showDecks();
</script>
